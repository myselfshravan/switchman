name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, test, lint
        run: scripts/check.sh
      - name: Build app and DMG
        run: |
          scripts/build_app.sh
          scripts/make_dmg.sh
      - name: Check tag matches app version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' out/Switchman.app/Contents/Info.plist)"
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > out/notes.md
          (cd out && shasum -a 256 Switchman-*.dmg | tee SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" out/Switchman-*.dmg out/SHA256SUMS \
            --title "Switchman $GITHUB_REF_NAME" --notes-file out/notes.md
